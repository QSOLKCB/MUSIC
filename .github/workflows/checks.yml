name: MUSIC checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DMUSIC_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug -DMUSIC_SANITIZE=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - run: cmake --build build --config Debug --parallel 2
      - run: ctest --test-dir build -C Debug --output-on-failure
      - name: Check platform-independent rendered bytes
        run: python3 scripts/check-render.py build/demo-reference.wav
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config xvfb xauth imagemagick
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install gtk4 pkgconf
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUSIC_BUILD_GUI=ON
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Exercise GTK and null-device playback and recording
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- sh scripts/gtk-smoke.sh
      - name: Preserve native UI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtk-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native Windows GTK toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          path-type: strict
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
      - name: Build, package, and test relocated native Windows desktop
        run: ./build-windows.sh
      - name: Preserve Windows package and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: music-windows-x64-preview
          path: |
            dist/*.zip
            dist/*.sha256
            artifacts/windows-package-smoke.log
          if-no-files-found: ignore
          retention-days: 14
